[package]
name = "tlsn-server"
version = "0.1.0"
edition = "2024"
description = "TLSNotary Verifier + Oracle Server for alpha.15"
license = "MIT OR Apache-2.0"

[lib]
name = "tlsn_server"
path = "src/lib.rs"

[[bin]]
name = "tlsn-server"
path = "src/main.rs"

[dependencies]
# TLSNotary
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }

# HTTP server
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
axum-core = "0.4"
http = "1.0"
hyper = "1.0"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# WebSocket
ws_stream_tungstenite = "0.14"
async-tungstenite = { version = "0.28", features = ["tokio-runtime"] }
futures-util = "0.3"
async-trait = "0.1"

# TLS crypto provider (ring for broad compatibility)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Cryptography
sha1 = "0.10"
sha3 = "0.10"
base64 = "0.22"
hex = "0.4"

# Compression
miniz_oxide = "0.8"

# Ethereum (oracle EIP-712 signing + on-chain reads)
alloy = { version = "1", features = ["signers", "signer-local", "sol-types"] }

# HTTP client (on-chain eth_call for escrow reads)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
eyre = "0.6"

# Utilities
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1.0", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

# dstack TEE SDK (TDX attestation + key derivation via /var/run/dstack.sock)
dstack-sdk = "0.1"

# LRU cache for short-lived inventory attestations
lru = "0.12"

# WebSocket + TLS for custom proxy transport
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1.0"
bytes = "1"

[dev-dependencies]
tlsn-server-fixture = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15" }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15" }
http-body-util = "0.1"
anyhow = "1.0"
rcgen = "0.13"
tokio-rustls = "0.26"
rustls-pemfile = "2"
portpicker = "0.1"
