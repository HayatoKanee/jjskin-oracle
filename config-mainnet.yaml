host: "0.0.0.0"
port: 7047

notarization:
  max_sent_data: 2048
  max_recv_data: 4096
  timeout: 120

tls:
  enabled: false  # Caddy reverse proxy handles HTTPS (Let's Encrypt → localhost:7047)

oracle:
  # No signing key configured — key is generated inside the TDX VM at each boot.
  # The private key never leaves TDX encrypted memory.
  contract_address: "0x93cdddfA3B3E9A27AF6C1956aD28e056E56bfF9b"  # JJSKIN on Arbitrum One
  chain_id: 42161  # Arbitrum One
  rpc_url: "https://arb1.arbitrum.io/rpc"
  steam_factory_address: "0xcd99F6C6C2f17B4118E2858aD3B5A1B748e17E4e"  # SteamAccountFactory on Arbitrum One

inspect:
  enabled: true
  request_delay_ms: 1100    # Per-bot rate limit (Steam enforced)
  request_timeout_s: 15     # Timeout for GC response
  max_retries: 3
  bots_config_path: "/app/bots.json"
