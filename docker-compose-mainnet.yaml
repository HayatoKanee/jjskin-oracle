# dstack compose file for TDX oracle — Arbitrum One (mainnet).
#
# The SHA256 of this file becomes the compose-hash, extended into RTMR[3].
# Any change to this file (including image digest) produces a different RTMR[3],
# which must be registered on-chain via setRtmr3().
#
# config.yaml is baked into the image (IS part of measurement).
#
# TODO: Add dstack-ingress sidecar for custom domain (oracle.jjskin.com)
#       See: https://docs.phala.com/phala-cloud/networking/setup-custom-domain
#       Requires: Cloudflare API token, CERTBOT_EMAIL, update RTMR[3] on DcapVerifier after deploy

services:
  oracle:
    image: lumio1/jjskin-oracle@sha256:30bf4231e8612b22529dd6712749b9e477a42ae94e4035e035c3981441ed4376
    ports:
      - "7047:7047"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - /var/run/tappd.sock:/var/run/tappd.sock:ro
    environment:
      - RUST_LOG=info
